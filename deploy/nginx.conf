# nginx для production «ПК ТУТ».
# - Отдаёт SPA-статику из /usr/share/nginx/html
# - Проксирует /api/* → backend:8001
# - Gzip, длинный кэш для статики /static/, no-cache для index.html.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Скрываем версию.
    server_tokens off;

    # Лимит тела запроса (форма заявки очень маленькая, оставим запас).
    client_max_body_size 1m;

    # ------- Gzip -------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    root /usr/share/nginx/html;
    index index.html;

    # ------- API прокси -------
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # OpenAPI/docs — тоже на backend.
    location = /api {
        proxy_pass http://backend:8001;
    }

    # ------- Статика с длинным кэшем -------
    # CRA складывает хэшированные файлы в /static/, их безопасно кэшировать надолго.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Прочие ассеты с расширениями — средний кэш.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html никогда не кэшируем — иначе клиенты застревают на старом бандле.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback — любой неизвестный путь отдаём index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Простой healthcheck для мониторинга.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
