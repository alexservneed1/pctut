# Caddyfile для «ПК ТУТ» (домен pctut.ru).
# Файл называется caddyfile.conf (не Caddyfile) — так Emergent push-агент
# гарантированно не отфильтрует его при синхронизации с GitHub.
# В docker-compose.yml файл монтируется в контейнер по пути /etc/caddy/Caddyfile.
#
# Что делает:
#   - Автоматически получает и продлевает Let's Encrypt сертификаты
#     для pctut.ru и www.pctut.ru.
#   - Редиректит www.pctut.ru → pctut.ru (301, с сохранением URI).
#   - Проксирует HTTPS-трафик на внутренний контейнер frontend:80 (nginx),
#     который отдаёт статику React и проксирует /api → backend:8001.
#   - Включает сжатие zstd / gzip.

# --- Редирект www на корневой домен ---
www.pctut.ru {
    redir https://pctut.ru{uri} permanent
}

# --- Основной домен ---
pctut.ru {
    encode zstd gzip

    # Пробрасываем в nginx-контейнер по внутренней docker-сети.
    reverse_proxy frontend:80 {
        header_up X-Real-IP {remote_host}
        header_up X-Forwarded-For {remote_host}
        header_up X-Forwarded-Proto {scheme}
    }

    # Небольшие security-заголовки. При желании расширьте.
    header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
    }
}
